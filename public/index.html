<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal do Candidato — Mandalog · SAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A4A;--orange:#E8751A;--bg:#F7F8FA;--surface:#FFFFFF;--ink:#1B2A4A;--muted:#64748B;--line:#E6E9EF;--danger:#DC2626;--ok:#059669;--shadow:0 10px 30px rgba(27,42,74,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
h1,h2,h3{font-family:'Outfit',system-ui,sans-serif;margin:0;line-height:1.15}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 64px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(13,21,38,.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .stepnote{color:#92A3BC}
.topbar-inner{max-width:720px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-family:'Outfit';font-weight:800;color:var(--navy);font-size:15px;letter-spacing:.2px}
.brand .dot{width:11px;height:11px;border-radius:3px;background:var(--orange)}
.stepnote{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.progress{height:4px;background:rgba(255,255,255,.13);border-radius:99px;overflow:hidden;max-width:720px;margin:0 auto}
.progress>i{display:block;height:100%;width:0;background:var(--orange);transition:width .35s ease}
.timer{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.timer .ring{position:relative;width:48px;height:48px;flex:0 0 auto}.timer .ring svg{transform:rotate(-90deg)}
.timer .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Outfit';font-weight:700;font-size:15px;color:var(--navy)}
.timer .lbl{font-size:13px;color:var(--muted)}.timer .lbl b{display:block;font-family:'Outfit';font-size:14px;color:var(--ink);font-weight:600}
.timer.warn{border-color:#FCD9B6}.timer.warn .num{color:var(--orange)}
.timer.crit{border-color:#F6B5B5;animation:pulse 1s infinite}.timer.crit .num{color:var(--danger)}
@keyframes pulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 4px rgba(220,38,38,.12)}}
@media (prefers-reduced-motion:reduce){.timer.crit{animation:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:var(--shadow)}
.eyebrow{font-size:12.5px;color:var(--orange);font-weight:600;margin-bottom:10px}
.q-title{font-size:19.5px;font-weight:700;color:var(--navy);margin-bottom:20px}.q-title .qcount{color:var(--muted);font-weight:600;font-size:14px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:11px;cursor:pointer;transition:border-color .15s,background .15s;background:#fff}
.opt:hover{border-color:#C9D2E0}.opt.sel{border-color:var(--orange);background:#FFF7EF}
.opt .mk{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:12px;font-weight:700;color:#fff;font-family:'Outfit'}
.opt.sel .mk{background:var(--orange);border-color:var(--orange)}.opt .txt{font-size:15px}
.likert{display:flex;gap:8px;justify-content:space-between;margin:6px 0 4px}
.lk{flex:1;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;padding:16px 4px;text-align:center;font-family:'Outfit';font-weight:700;color:var(--navy);font-size:16px;transition:.15s}
.lk:hover{border-color:#C9D2E0}.lk.sel{border-color:var(--orange);background:var(--orange);color:#fff}
.lk-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:2px}
.fc{display:grid;gap:12px}.fc .opt{padding:18px 16px;font-size:15.5px}.fc .opt .mk{background:#eef1f6;color:var(--navy)}.fc .opt.sel .mk{background:var(--orange);color:#fff}
.btn{appearance:none;border:0;border-radius:12px;font-family:'Outfit';font-weight:600;font-size:16px;padding:15px 22px;cursor:pointer;transition:transform .05s,background .15s;width:100%}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:#d76a12}.btn-primary:active{transform:scale(.99)}.btn-primary:disabled{background:#E7CBB0;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}.btn-row{margin-top:22px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:500;margin:14px 0 6px}
input.f,select.f{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-family:'Inter';color:var(--ink);background:#fff}
input.f:focus,select.f:focus{outline:none;border-color:var(--orange)}
.brandlogo{display:block;height:36px;width:auto}
@media(max-width:420px){.brandlogo{height:30px}}

/* Capa com a foto do armazem — mesma linguagem do mandalog.com.br */
.capa{position:relative;border-radius:16px;overflow:hidden;margin-bottom:18px;background:#0D1526;
 background-image:linear-gradient(105deg,rgba(13,21,38,.90) 0%,rgba(13,21,38,.72) 48%,rgba(13,21,38,.45) 100%),url('/armazem-sm.jpg');
 background-size:cover;background-position:center;box-shadow:var(--shadow)}
@media(min-width:561px){.capa{background-image:linear-gradient(105deg,rgba(13,21,38,.92) 0%,rgba(13,21,38,.70) 48%,rgba(13,21,38,.38) 100%),url('/armazem.jpg')}}
.capa-in{position:relative;padding:40px 26px 34px;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end}
.capa .eyebrow-vaga{display:inline-block;border-left:3px solid var(--orange);background:rgba(13,21,38,.55);
 color:#DCE5F2;font-family:'Outfit';font-weight:600;font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;
 padding:7px 12px;margin-bottom:16px;line-height:1.5}
.capa h1{font-family:'Outfit';font-weight:800;text-transform:uppercase;font-size:38px;line-height:.98;
 letter-spacing:-.8px;color:#fff;margin-bottom:14px}
.capa h1 em{font-style:normal;color:var(--orange)}
.capa .lead{color:#C8D5E8;font-size:15.5px;margin:0;max-width:30em;text-shadow:0 1px 10px rgba(13,21,38,.6)}
@media(max-width:420px){.capa-in{padding:28px 18px 24px;min-height:230px}.capa h1{font-size:30px}.capa .eyebrow-vaga{font-size:10.5px;letter-spacing:1.2px}}

.hero h1{font-size:28px;color:var(--navy);margin-bottom:8px;letter-spacing:-.3px}
.hero .role{display:inline-block;background:var(--navy);color:#fff;font-family:'Outfit';font-weight:600;font-size:13px;padding:6px 12px;border-radius:8px;margin-bottom:18px}
.lead{color:var(--muted);font-size:15.5px;margin-bottom:22px}
.steps{display:grid;gap:10px;margin:20px 0}
.stepitem{display:flex;gap:13px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#fff}
.stepitem .n{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:#FFF1E4;color:var(--orange);font-family:'Outfit';font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.stepitem .d{font-size:14.5px}.stepitem .d b{display:block;font-family:'Outfit';color:var(--navy);font-weight:600}
.rules{background:#FFF7EF;border:1px solid #FCD9B6;border-radius:12px;padding:15px 16px;font-size:13.5px;color:#7a4a17;margin:18px 0}
.rules b{color:#8a4a10}.rules ul{margin:8px 0 0;padding-left:18px}.rules li{margin:4px 0}
.audiobox{background:#0d1526;border-radius:14px;position:relative;padding:26px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:190px}
.audiobox .ph{color:#8896b3;font-size:14px;text-align:center}
.mic{width:66px;height:66px;border-radius:50%;background:#1b2a4a;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:background .2s}
.mic.on{background:var(--orange)}.mic svg{width:30px;height:30px;fill:#fff}
.level{width:100%;max-width:260px;height:8px;border-radius:99px;background:#1b2a4a;overflow:hidden}
.level>i{display:block;height:100%;width:0;background:var(--orange);border-radius:99px;transition:width .1s linear}
.audiobox audio{width:100%;max-width:320px}
.rec-dot{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.5);color:#fff;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600}
.rec-dot i{width:9px;height:9px;border-radius:50%;background:#ff4d4d;animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}
.ajuda{display:flex;gap:16px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:15px 16px;margin-top:18px}
.ajuda .txt{flex:1 1 auto;font-size:13.5px;color:var(--muted)}
.ajuda .txt b{display:block;font-family:'Outfit';font-weight:600;color:var(--navy);font-size:14.5px;margin-bottom:3px}
.ajuda .qr{flex:0 0 auto;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.ajuda .qr img{display:block;width:100%;height:100%}
.zap{display:inline-flex;align-items:center;gap:7px;margin-top:9px;font-family:'Outfit';font-weight:600;font-size:13.5px;color:#fff;background:#25D366;padding:8px 14px;border-radius:10px;text-decoration:none}
.zap svg{width:16px;height:16px;fill:#fff}
@media(max-width:560px){.ajuda .qr{display:none}}
.scorebig{font-family:'Outfit';font-weight:800;font-size:46px;color:var(--navy);line-height:1}
.badge{display:inline-block;font-family:'Outfit';font-weight:700;font-size:13px;padding:7px 14px;border-radius:99px}
.badge.pri{background:#DCFCE7;color:#166534}.badge.rec{background:#FEF3C7;color:#92400E}.badge.ana{background:#E2E8F0;color:#475569}
.dimrow{margin:11px 0}.dimrow .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.dimrow .top b{font-family:'Outfit';color:var(--navy);font-weight:600}.dimrow .top span{color:var(--muted);font-weight:600}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#E8751A,#F2A05A);border-radius:99px}
.sectile{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}.sectile:last-child{border:0}.sectile b{font-family:'Outfit';color:var(--navy)}
.payload{background:#0d1526;color:#9fb3d1;border-radius:12px;padding:16px;font-family:ui-monospace,monospace;font-size:11.5px;overflow-x:auto;white-space:pre;margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--danger);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%}
.toast.show{opacity:1}.hide{display:none !important}.small{font-size:12.5px;color:var(--muted)}
.radar{display:block;margin:6px auto 2px}
.slotday{margin:18px 0 2px;font-family:'Outfit';font-weight:700;color:var(--navy);font-size:14px}
.slotper{margin:8px 0 5px;font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.slots{display:flex;flex-wrap:wrap;gap:9px}
.slot{border:1.5px solid var(--line);border-radius:11px;padding:11px 15px;font-family:'Outfit';font-weight:600;color:var(--navy);cursor:pointer;background:#fff;font-size:14px;transition:.15s}
.slot:hover{border-color:var(--orange)}.slot.sel{background:var(--orange);color:#fff;border-color:var(--orange)}
.slot.taken{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.okbox{background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:16px;color:#065F46;font-size:14.5px}
.okbox b{font-family:'Outfit'}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner"><img class="brandlogo" src="/logo-topo.png" alt="Mandalog Operações Logísticas" width="113" height="36"><div class="stepnote" id="stepnote"></div></div><div class="progress"><i id="progbar"></i></div></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ===== VAGA ===== */
const VAGA={titulo:"Assistente de SAC — Monitoramento de Entregas",local:"Bonsucesso, Guarulhos/SP · 2 vagas",
  jornada:"Segunda a sábado",corte:85};
/* 7 competências da descrição do cargo */
const DIMS={COM:"Comunicação clara",URG:"Senso de urgência",CONF:"Gestão de conflitos",PRO:"Proatividade",COB:"Cobrança e influência",RES:"Resiliência",REG:"Capricho no registro"};

/* ===== TRIAGEM (não cronometrada; pontua requisitos) ===== */
const TRIAGEM=[
  {id:"exp",label:"Você tem experiência em SAC ou torre de controle de distribuição urbana (last mile)?",
    op:[["Mais de 1 ano",3],["De 6 meses a 1 ano",2],["Menos de 6 meses",1],["Não tenho",0]]},
  {id:"app",label:"Qual aplicativo de rastreamento de entregas você já usou no dia a dia?",
    op:[["GreenMile",3],["Outro app de rastreamento",2],["Nunca usei",0]]},
  {id:"esl",label:"Você já trabalhou com o ESL?",op:[["Sim",2],["Não",0]]},
  {id:"bairro",label:"Em qual região você mora?",
    op:[["Bonsucesso, Pimentas, Pres. Dutra ou arredores",2],["Outro bairro de Guarulhos",1],["Outra cidade",0]]},
  {id:"sabado",label:"A jornada é de segunda a sábado. Você tem disponibilidade para trabalhar aos sábados?",score:false,
    op:[["Sim, sem problema",0],["Sim, mas só alguns sábados",0],["Não tenho disponibilidade",0]]},
  {id:"horario",label:"Qual horário você prefere? (sábado, meio período)",score:false,
    op:[["07h às 17h",0],["09h às 19h",0],["Tanto faz",0]]}
];
const TRIAGEM_MAX=TRIAGEM.filter(t=>t.score!==false).reduce((a,t)=>a+Math.max(...t.op.map(o=>o[1])),0);

/* ===== SEÇÕES CRONOMETRADAS ===== */
const SECOES=[
  {id:"tecnico",nome:"Teste Técnico e Prático",eyebrow:"Conhecimento e procedimento do SAC (há resposta correta)",tempo:55,tipo:"mcq",
   questoes:[
    {q:"Um veículo está parado há 70 minutos no cliente, sem atualização no app. Sua primeira ação é:",op:[
      {t:"Abrir a ocorrência no sistema e acompanhar até o motorista atualizar o status pelo app"},
      {t:"Falar com o motorista agora, entender a causa e avisar o cliente se a janela for afetada",correta:true},
      {t:"Avisar o cliente do atraso, abrir a ocorrência e depois apurar a causa com o motorista"},
      {t:"Acionar o gestor da conta para que ele verifique a situação com o motorista"}]},
    {q:"O motorista precisa fazer uma descarga em rota. O procedimento correto é:",op:[
      {t:"Orientar o motorista a pagar, guardar o comprovante e confirmar com o cliente no mesmo dia"},
      {t:"Pedir a autorização ao gestor da conta e lançar o valor na prestação de contas da rota"},
      {t:"Obter a autorização do cliente antes do pagamento, orientar o motorista e lançar o comprovante no ESL",correta:true},
      {t:"Registrar a necessidade no GreenMile e seguir a orientação que o motorista receber no local"}]},
    {q:"Uma reentrega foi acordada com o cliente. Para a operação poder cobrá-la, você precisa:",op:[
      {t:"Registrar a senha de reentrega no ESL e no GreenMile, vinculada à nota fiscal",correta:true},
      {t:"Abrir a ocorrência de reentrega no GreenMile com a data acordada e o motivo da primeira tentativa"},
      {t:"Lançar a reentrega no ESL e anexar o canhoto da tentativa que foi frustrada"},
      {t:"Encaminhar o e-mail do cliente autorizando a reentrega para a prestação de contas"}]},
    {q:"Chega um alerta do gerenciamento de risco (desvio de rota). O correto é:",op:[
      {t:"Ligar para o motorista e confirmar se está tudo bem antes de acionar a gerenciadora"},
      {t:"Registrar o alerta e acompanhar pelo rastreador até o veículo voltar à rota prevista"},
      {t:"Acionar o gestor da conta e aguardar a orientação dele para falar com a gerenciadora"},
      {t:"Tratar em até 5 minutos com a central da gerenciadora e acionar o gestor se houver desvio ou sinistro",correta:true}]},
    {q:"Entrega frustrada: o ponto de venda estava fechado. Além de reagendar, o que não pode faltar?",op:[
      {t:"Confirmar o novo horário com o cliente e registrar o reagendamento no GreenMile"},
      {t:"Registrar a causa da frustração na ocorrência, com o horário da tentativa e a evidência do motorista",correta:true},
      {t:"Informar a frustração ao gestor da conta no relatório de fechamento do dia"},
      {t:"Pedir ao motorista que tente de novo no fim da rota antes de registrar a frustração"}]},
    {q:"Pela regra da operação, o prazo máximo para responder uma mensagem de motorista ou cliente é:",op:[
      {t:"15 minutos",correta:true},{t:"30 minutos"},{t:"1 hora"},{t:"Até o fim do turno"}]},
    {q:"Ao terminar o seu turno, antes de sair, você precisa:",op:[
      {t:"Atualizar o status de todas as entregas no GreenMile e registrar as ocorrências abertas"},
      {t:"Deixar as pendências registradas no ESL para quem assumir o turno consultar"},
      {t:"Passar por escrito as entregas ainda em rota e as pendências ao próximo responsável",correta:true},
      {t:"Avisar o gestor da conta do que ficou pendente e retomar no início do próximo turno"}]}
   ]},
  {id:"comportamento",nome:"Comportamento",eyebrow:"O quanto combina com você (não há resposta certa)",tempo:30,tipo:"likert",
   questoes:[
    {t:"Escrevo mensagens curtas e objetivas: digo o que houve, o que estou fazendo e quando dou retorno.",dim:"COM"},
    {t:"Quando algo trava uma entrega, trato na hora — não deixo para depois.",dim:"URG"},
    {t:"Mantenho a calma com motorista irritado ou cliente cobrando, e foco na solução, não no culpado.",dim:"CONF"},
    {t:"Costumo agir antes de o problema estourar: ligo para o motorista parado sem ninguém pedir.",dim:"PRO"},
    {t:"Cobro senha, comprovante e resposta com firmeza e respeito, sem precisar escalar para o chefe.",dim:"COB"},
    {t:"Nos dias de pico eu perco o ritmo e demoro a me recuperar depois de um erro.",dim:"RES",rev:true},
    {t:"Registro tudo no sistema no mesmo dia: causa, senha e comprovante.",dim:"REG"}
   ]},
  {id:"valores",nome:"Valores no trabalho",eyebrow:"O que mais combina com você (as duas são boas; não há certo)",tempo:25,tipo:"fc",
   questoes:[
    {a:{t:"Respondo rápido, mesmo que a mensagem seja curta.",dim:"URG"},b:{t:"Registro tudo com capricho, mesmo que leve mais tempo.",dim:"REG"}},
    {a:{t:"Me sinto bem quando acalmo um conflito.",dim:"CONF"},b:{t:"Me sinto bem quando antecipo um problema.",dim:"PRO"}},
    {a:{t:"Insisto até conseguir o retorno do motorista ou do cliente.",dim:"COB"},b:{t:"Mantenho a cabeça fria quando tudo acontece ao mesmo tempo.",dim:"RES"}},
    {a:{t:"Comunico de forma clara e sem ruído.",dim:"COM"},b:{t:"Trato primeiro o que trava a entrega.",dim:"URG"}}
   ]}
];
const VIDEO={nome:"Entrevista em Áudio",eyebrow:"Resposta gravada em áudio",tempo:75,
  questoes:["Conte uma situação real em que um cliente ou motorista estava irritado e você resolveu. O que você fez e falou, na prática?",
            "Num dia de pico, com várias ocorrências ao mesmo tempo, como você se organiza para não deixar nada sem resposta?"]};

/* ===== ESTADO ===== */
const st={cand:{},triagem:{},secIdx:0,qIdx:0,respostas:{},videoIdx:0,videoBlobs:[],focoPerdido:0,timer:null,timeLeft:0,screen:""};
SECOES.forEach(s=>st.respostas[s.id]=[]);
const app=document.getElementById('app'),toastEl=document.getElementById('toast');let toastT=null;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2600);}
const totalItens=SECOES.reduce((a,s)=>a+s.questoes.length,0);
const totalPassos=1+1+totalItens+VIDEO.questoes.length+1;
function setProgress(step,label){document.getElementById('progbar').style.width=Math.min(100,(step/totalPassos)*100)+'%';document.getElementById('stepnote').textContent=label||'';}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&['q','video'].includes(st.screen)){st.focoPerdido++;toast('Saída de tela detectada e registrada.');}});
function val(id){return document.getElementById(id).value.trim();}
function soDigitos(s){return (s||'').replace(/\D/g,'').slice(0,11);}
function formataFone(s){const d=soDigitos(s);if(d.length<=2)return d?'('+d:'';const corte=d.length>10?7:6;
 return d.length<=corte?'('+d.slice(0,2)+') '+d.slice(2):'('+d.slice(0,2)+') '+d.slice(2,corte)+'-'+d.slice(corte);}

const CHAVE_PART='mdl_rh_participou';
function participacaoLocal(){try{return JSON.parse(localStorage.getItem(CHAVE_PART)||'null');}catch(e){return null;}}
function marcaParticipacao(c){try{localStorage.setItem(CHAVE_PART,JSON.stringify({email:c.email,nome:c.nome,data:new Date().toISOString()}));}catch(e){}}
async function verificaDuplicado(c){
 const local=participacaoLocal();
 if(local&&local.email&&local.email.toLowerCase()===c.email.toLowerCase())return{ja_participou:true,...local};
 const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),6000);
 try{
  const r=await fetch('/api/candidatura',{method:'POST',headers:{'Content-Type':'application/json'},
   signal:ctrl.signal,body:JSON.stringify({tipo:'verificar',email:c.email,telefone:c.telefone})});
  return await r.json();
 }finally{clearTimeout(t);}
}
function telaJaParticipou(r){st.screen='duplicado';setProgress(0,'');
 const quando=r.data?(' em '+new Date(r.data).toLocaleDateString('pt-BR')):'';

 html+=`<div class="btn-row"><button class="btn btn-primary" id="go">Iniciar avaliação</button></div></div>`;

 document.getElementById('go').onclick=()=>{

   st.secIdx=0;st.qIdx=0;runItem();};}

/* ===== RUNNER ===== */
function runItem(){const sec=SECOES[st.secIdx],it=sec.questoes[st.qIdx];st.screen='q';
 const passo=2+SECOES.slice(0,st.secIdx).reduce((a,s)=>a+s.questoes.length,0)+st.qIdx+1;setProgress(passo,sec.nome);
 let sel=null;
 const timerHTML=`<div class="timer" id="timer"><div class="ring"><svg width="48" height="48"><circle cx="24" cy="24" r="20" stroke="#E6E9EF" stroke-width="4" fill="none"></circle><circle id="ringfg" cx="24" cy="24" r="20" stroke="#E8751A" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="125.6" stroke-dashoffset="0"></circle></svg><div class="num" id="tnum">${sec.tempo}</div></div><div class="lbl">Tempo para responder<b id="tlbl">${sec.tempo}s restantes</b></div></div>`;
 const head=`<div class="eyebrow">${sec.eyebrow}</div>`,count=`<span class="qcount">Pergunta ${st.qIdx+1} de ${sec.questoes.length}</span>`;
 let body='';
 if(sec.tipo==='mcq'){body=`${head}<h2 class="q-title">${count}<br>${it.q}</h2><div id="opts"></div>`;}
 else if(sec.tipo==='likert'){body=`${head}<h2 class="q-title">${count}<br>${it.t}</h2><div class="likert" id="lk">${[1,2,3,4,5].map(n=>`<div class="lk" data-v="${n-1}">${n}</div>`).join('')}</div><div class="lk-ends"><span>Não combina</span><span>Combina muito</span></div>`;}
 else if(sec.tipo==='fc'){body=`${head}<h2 class="q-title">${count}<br>O que mais combina com você?</h2><div class="fc" id="fc"><div class="opt" data-v="0"><div class="mk">A</div><div class="txt">${it.a.t}</div></div><div class="opt" data-v="1"><div class="mk">B</div><div class="txt">${it.b.t}</div></div></div>`;}
 app.innerHTML=timerHTML+`<div class="card">${body}<div class="btn-row"><button class="btn btn-primary" id="next" disabled>Próxima</button></div></div>`;
 const next=document.getElementById('next');
 function pick(v,el,g){sel=v;g.forEach(c=>c.classList.remove('sel'));el.classList.add('sel');next.disabled=false;}
 if(sec.tipo==='mcq'){const o=document.getElementById('opts');it.op.forEach((op,i)=>{const d=document.createElement('div');d.className='opt';d.innerHTML=`<div class="mk">${String.fromCharCode(65+i)}</div><div class="txt">${op.t}</div>`;d.onclick=()=>pick(i,d,[...o.children]);o.appendChild(d);});}
 else if(sec.tipo==='likert'){const g=[...document.querySelectorAll('#lk .lk')];g.forEach(el=>el.onclick=()=>pick(+el.dataset.v,el,g));}
 else if(sec.tipo==='fc'){const g=[...document.querySelectorAll('#fc .opt')];g.forEach(el=>el.onclick=()=>pick(+el.dataset.v,el,g));}
 next.onclick=()=>commit(sel);startTimer(sec.tempo,()=>commit(sel));}
function commit(sel){clearInterval(st.timer);const sec=SECOES[st.secIdx];st.respostas[sec.id][st.qIdx]=(sel==null?null:sel);
 if(st.qIdx<sec.questoes.length-1){st.qIdx++;runItem();}else if(st.secIdx<SECOES.length-1){st.secIdx++;st.qIdx=0;runItem();}else{st.videoIdx=0;runVideo();}}
function startTimer(secs,onEnd){st.timeLeft=secs;const box=document.getElementById('timer'),num=document.getElementById('tnum'),lbl=document.getElementById('tlbl'),fg=document.getElementById('ringfg'),C=125.6;
 const tick=()=>{num.textContent=st.timeLeft;lbl.textContent=st.timeLeft+'s restantes';fg.style.strokeDashoffset=C*(1-st.timeLeft/secs);box.classList.toggle('warn',st.timeLeft<=Math.ceil(secs*.4)&&st.timeLeft>8);box.classList.toggle('crit',st.timeLeft<=8);if(st.timeLeft<=0){clearInterval(st.timer);toast('Tempo esgotado — avançando.');onEnd();return;}st.timeLeft--;};
 tick();st.timer=setInterval(tick,1000);}

/* ===== ÁUDIO ===== */
let mediaStream=null,recorder=null,chunks=[],audioCtx=null,levelRaf=null;
const MIC_SVG='<svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M18 11a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.1a6 6 0 0 0 5-5.9Z"/></svg>';
function escolheMime(){const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
 for(const m of c){if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m;}return '';}
function extDoMime(m){if(!m)return 'webm';if(m.indexOf('mp4')>=0)return 'm4a';if(m.indexOf('ogg')>=0)return 'ogg';return 'webm';}

function runVideo(){st.screen='video';const passo=2+totalItens+st.videoIdx+1;setProgress(passo,VIDEO.nome);const p=VIDEO.questoes[st.videoIdx];
 app.innerHTML=`<div class="card"><div class="eyebrow">${VIDEO.eyebrow} — ${st.videoIdx+1} de ${VIDEO.questoes.length}</div><h2 class="q-title" style="margin-bottom:16px">${p}</h2>
  <div class="audiobox" id="vbox"><div class="mic" id="micicon">${MIC_SVG}</div>
   <div class="ph" id="vph">Clique em <b>Ativar microfone</b> para gravar.<br><span class="small">Você terá ${VIDEO.tempo}s. Encerra sozinho.</span></div>
   <div class="level hide" id="lvl"><i id="lvlbar"></i></div>
   <div class="rec-dot hide" id="recdot"><i></i><span id="rectime">${VIDEO.tempo}s</span></div></div>
  <div class="btn-row"><button class="btn btn-ghost" id="cam">Ativar microfone</button></div><div id="ctrls" class="hide" style="margin-top:11px"><button class="btn btn-primary" id="rec">Gravar resposta</button></div><p class="small" id="vhint" style="margin-top:12px"></p></div>`;
 document.getElementById('cam').onclick=enableCam;}

async function enableCam(){try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
  document.getElementById('vph').innerHTML='Microfone ligado. Fale para testar — a barra abaixo tem que se mexer.<br><span class="small">Você terá '+VIDEO.tempo+'s. Encerra sozinho.</span>';
  document.getElementById('lvl').classList.remove('hide');document.getElementById('micicon').classList.add('on');
  medirNivel();document.getElementById('cam').classList.add('hide');
  document.getElementById('ctrls').classList.remove('hide');document.getElementById('rec').onclick=startRec;}
 catch(e){document.getElementById('vhint').innerHTML='Microfone indisponível ou sem permissão. Libere o microfone no navegador e recarregue, ou siga sem gravar.';
  const b=document.getElementById('cam');b.textContent='Seguir sem gravar';b.onclick=()=>{st.videoBlobs.push({simulado:true,pergunta:st.videoIdx});nextVideo();};}}

function medirNivel(){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const src=audioCtx.createMediaStreamSource(mediaStream),an=audioCtx.createAnalyser();an.fftSize=512;
  src.connect(an);const buf=new Uint8Array(an.fftSize);const bar=document.getElementById('lvlbar');
  const loop=()=>{an.getByteTimeDomainData(buf);let pico=0;
   for(let i=0;i<buf.length;i++){const d=Math.abs(buf[i]-128);if(d>pico)pico=d;}
   if(bar)bar.style.width=Math.min(100,Math.round(pico/128*100*2.2))+'%';levelRaf=requestAnimationFrame(loop);};loop();}catch(e){}}

function pararNivel(){if(levelRaf)cancelAnimationFrame(levelRaf);levelRaf=null;
 if(audioCtx){try{audioCtx.close();}catch(e){}audioCtx=null;}}

function startRec(){chunks=[];const mime=escolheMime();
 try{recorder=mime?new MediaRecorder(mediaStream,{mimeType:mime,audioBitsPerSecond:32000}):new MediaRecorder(mediaStream);}
 catch(e){try{recorder=new MediaRecorder(mediaStream);}catch(e2){toast('Gravação não suportada neste navegador.');return;}}
 recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
 recorder.onstop=()=>{const tipo=recorder.mimeType||mime||'audio/webm';const blob=new Blob(chunks,{type:tipo});
  const rd=new FileReader();rd.onloadend=()=>{st.videoBlobs.push({pergunta:st.videoIdx,size:blob.size,mime:tipo,ext:extDoMime(tipo),dataUrl:rd.result});stopStream();nextVideo();};rd.readAsDataURL(blob);};
 recorder.start();document.getElementById('recdot').classList.remove('hide');
 const rb=document.getElementById('rec');rb.textContent='Encerrar agora';rb.onclick=()=>{if(recorder.state==='recording')recorder.stop();};
 let t=VIDEO.tempo;const rt=document.getElementById('rectime');const iv=setInterval(()=>{t--;if(rt)rt.textContent=t+'s';if(t<=0){clearInterval(iv);if(recorder.state==='recording')recorder.stop();}},1000);}

function stopStream(){pararNivel();if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}}
function nextVideo(){if(st.videoIdx<VIDEO.questoes.length-1){st.videoIdx++;runVideo();}else screenResultado();}

/* ===== SCORING ===== */
function calcTriagem(){let got=0;TRIAGEM.filter(t=>t.score!==false).forEach(t=>{got+=t.op[st.triagem[t.id]][1];});return Math.round(got/TRIAGEM_MAX*100);}
function calcTecnico(){const sec=SECOES.find(s=>s.tipo==='mcq'),r=st.respostas[sec.id];let got=0;sec.questoes.forEach((q,i)=>{const o=q.op[r[i]];if(o&&o.correta)got++;});return{got,total:sec.questoes.length,pct:Math.round(got/sec.questoes.length*100)};}
function calcPerfil(){const got={},max={};Object.keys(DIMS).forEach(d=>{got[d]=0;max[d]=0;});
 SECOES.forEach(sec=>{if(sec.tipo==='mcq')return;const r=st.respostas[sec.id];sec.questoes.forEach((it,i)=>{const resp=r[i];
  if(sec.tipo==='likert'){max[it.dim]+=5;if(resp!=null){const v=resp+1;got[it.dim]+=it.rev?(6-v):v;}}
  else if(sec.tipo==='fc'){max[it.a.dim]+=1;max[it.b.dim]+=1;if(resp!=null)got[resp===0?it.a.dim:it.b.dim]+=1;}});});
 const prof={};Object.keys(DIMS).forEach(d=>{prof[d]=max[d]?Math.round(got[d]/max[d]*100):0;});return prof;}
function radarSVG(prof){const keys=Object.keys(DIMS),N=keys.length,cx=140,cy=140,R=95;
 const pt=(i,r)=>{const a=(-90+i*360/N)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
 let grid='';[.25,.5,.75,1].forEach(f=>{grid+=`<polygon points="${keys.map((k,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#E6E9EF" stroke-width="1"/>`;});
 let axes='',labels='';keys.forEach((k,i)=>{const[x,y]=pt(i,R);axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E6E9EF" stroke-width="1"/>`;const[lx,ly]=pt(i,R+20);const an=Math.abs(lx-cx)<6?'middle':(lx>cx?'start':'end');labels+=`<text x="${lx}" y="${ly+4}" font-size="9.5" font-family="Outfit,sans-serif" font-weight="600" fill="#1B2A4A" text-anchor="${an}">${DIMS[k].split(' ')[0]}</text>`;});
 const data=keys.map((k,i)=>pt(i,R*(prof[k]/100)).join(',')).join(' ');
 return `<svg class="radar" width="280" height="285" viewBox="0 0 280 285">${grid}${axes}<polygon points="${data}" fill="rgba(232,117,26,.22)" stroke="#E8751A" stroke-width="2"/>${labels}</svg>`;}

function screenResultado(){st.screen='fim';setProgress(totalPassos,'Conclusão');
 const req=calcTriagem(),tec=calcTecnico(),prof=calcPerfil();
 const perf=Math.round(Object.values(prof).reduce((a,b)=>a+b,0)/Object.keys(prof).length);
 const nota=Math.round(0.20*req+0.45*tec.pct+0.35*perf);
 const aprovado=nota>=VAGA.corte;
 const cls=aprovado?'pri':nota>=70?'rec':'ana',clsL=aprovado?'Acima do corte — agendar entrevista':nota>=70?'Em análise':'Abaixo do corte';
 const payload={vaga:VAGA.titulo,...st.cand,triagem:st.triagem,nota_final:nota,req_pct:req,tecnico_pct:tec.pct,perfil:prof,perfil_pct:perf,audios:st.videoBlobs.length,foco_perdido:st.focoPerdido,status:aprovado?"AGENDAR_ENTREVISTA":"EM_ANALISE",data:new Date().toISOString()};
 enviarCandidatura(payload);
 const dims=Object.keys(DIMS).map(d=>`<div class="dimrow"><div class="top"><b>${DIMS[d]}</b><span>${prof[d]}%</span></div><div class="bar"><i style="width:${prof[d]}%"></i></div></div>`).join('');
 app.innerHTML=`<div class="card"><div class="eyebrow">Avaliação concluída</div><h2 class="q-title" style="margin-bottom:6px">Obrigado, ${st.cand.nome.split(' ')[0]}!</h2>
  <div style="display:flex;align-items:center;gap:16px;margin:8px 0 18px"><div class="scorebig">${nota}</div><div><div class="small" style="margin-bottom:6px">Nota final (0–100)</div><span class="badge ${cls}">${clsL}</span></div></div>
  <div class="sectile"><span>Triagem / requisitos</span><b>${req}%</b></div>
  <div class="sectile"><span>Teste técnico e prático</span><b>${tec.got}/${tec.total} · ${tec.pct}%</b></div>
  <div class="sectile"><span>Aderência de perfil</span><b>${perf}%</b></div>
  <div class="sectile"><span>Entrevista em áudio</span><b>${st.videoBlobs.length} resposta(s)</b></div>
  <h3 style="font-size:15px;color:var(--navy);margin:22px 0 2px">Perfil nas 7 competências do SAC</h3>
  <p class="small" style="margin-bottom:4px">Sem certo ou errado — mostra as suas tendências.</p>${radarSVG(prof)}${dims}
  <div class="btn-row" id="cta"></div>
  <details style="margin-top:18px"><summary class="small" style="cursor:pointer">Ver dados que vão para o RH (n8n)</summary><div class="payload">${JSON.stringify(payload,null,2)}</div></details>${blocoAjuda()}</div>`;
 const cta=document.getElementById('cta');
 if(aprovado){const b=document.createElement('button');b.className='btn btn-primary';b.textContent='Agendar minha entrevista';b.onclick=screenAgenda;cta.appendChild(b);}
 else{cta.innerHTML=`<div class="okbox" style="background:#F1F5F9;border-color:#E2E8F0;color:#475569">Recebemos a sua candidatura. Vamos analisar o seu resultado e, havendo aderência, o RH entra em contato pelo WhatsApp.</div>`;}}

/* ===== AGENDAMENTO (trava real via n8n + Google Calendar) =====
   Entrevistas das 14h às 16h, de 30 em 30 minutos, em dias úteis. */
const AGENDA={janelas:[{nome:'Manhã',inicio:'10:00',fim:'12:00'},
                       {nome:'Tarde',inicio:'14:00',fim:'16:00'}],
              passo:30,duracao:30,dias:5,sabado:false};
function horariosDoDia(){const out=[];
 AGENDA.janelas.forEach(j=>{const [hi,mi]=j.inicio.split(':').map(Number),[hf,mf]=j.fim.split(':').map(Number);
  for(let m=hi*60+mi;m<=hf*60+mf;m+=AGENDA.passo){
   out.push({periodo:j.nome,time:String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')});}});
 return out;}
function genSlots(){const out=[],horas=horariosDoDia();
 const base=new Date();base.setHours(0,0,0,0);let d=new Date(base);let added=0,guarda=0;
 while(added<AGENDA.dias&&guarda++<60){d.setDate(d.getDate()+1);const wd=d.getDay();
  if(wd===0||(wd===6&&!AGENDA.sabado))continue;
  horas.forEach(h=>out.push({id:d.toISOString().slice(0,10)+'_'+h.time,date:new Date(d),time:h.time,periodo:h.periodo}));added++;}
 return out;}
function takenSet(){try{return new Set(JSON.parse(localStorage.getItem('mdl_slots_taken')||'[]'));}catch(e){return new Set();}}
function saveTaken(s){try{localStorage.setItem('mdl_slots_taken',JSON.stringify([...s]));}catch(e){}}
function screenAgenda(){st.screen='agenda';
 const slots=genSlots(),taken=takenSet();let sel=null;
 const dias={};slots.forEach(s=>{const k=s.date.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});(dias[k]=dias[k]||[]).push(s);});
 let html=`<div class="card"><div class="eyebrow">Você passou do corte 🎉</div><h2 class="q-title" style="margin-bottom:8px">Agende sua entrevista com um gestor</h2>
  <p class="small" style="margin-bottom:6px">Escolha um horário livre. Cada horário recebe <b>uma única entrevista</b> — ao reservar, ele fica indisponível para os demais candidatos.</p>`;
 Object.entries(dias).forEach(([dia,ss])=>{html+=`<div class="slotday">${dia}</div>`;
  const pers={};ss.forEach(s=>{(pers[s.periodo]=pers[s.periodo]||[]).push(s);});
  Object.entries(pers).forEach(([per,ps])=>{html+=`<div class="slotper">${per}</div><div class="slots">`
   +ps.map(s=>{const t=taken.has(s.id);return `<div class="slot ${t?'taken':''}" data-id="${s.id}">${s.time}</div>`;}).join('')+`</div>`;});});
 html+=`<div class="btn-row"><button class="btn btn-primary" id="conf" disabled>Confirmar horário</button></div>
  <p class="small" style="margin-top:12px">Protótipo: a reserva fica gravada neste navegador. Em produção, a trava entre todos os candidatos é feita pelo n8n na agenda real dos gestores (Google Calendar), impossibilitando dois agendamentos no mesmo horário.</p></div>`;
 app.innerHTML=html;
 const conf=document.getElementById('conf');
 [...document.querySelectorAll('.slot:not(.taken)')].forEach(el=>el.onclick=()=>{sel=el.dataset.id;document.querySelectorAll('.slot').forEach(s=>s.classList.remove('sel'));el.classList.add('sel');conf.disabled=false;});
 conf.onclick=()=>{if(!sel)return;const taken=takenSet();if(taken.has(sel)){toast('Esse horário acabou de ser reservado. Escolha outro.');screenAgenda();return;}
  taken.add(sel);saveTaken(taken);
  conf.disabled=true;conf.textContent='Enviando...';
  const slot=genSlots().find(s=>s.id===sel);
  const quando=slot.date.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})+' às '+slot.time;
  enviarAgendamento(slot,quando);
  app.innerHTML=`<div class="card"><div class="eyebrow">Horário reservado</div><h2 class="q-title" style="margin-bottom:14px">Obrigado, ${st.cand.nome.split(' ')[0]}!</h2>
   <div class="okbox"><b>Sua preferência de horário</b><br>${quando}<br>Local: Posto avançado — GLP Bonsucesso, Guarulhos</div>
   <p class="small" style="margin-top:16px">O RH vai <b>confirmar a entrevista pelo WhatsApp</b> no número que você cadastrou, com o convite da agenda e o link da chamada. Se precisar remarcar ou não receber a confirmação em até 1 dia útil, fale com a gente:</p>
   ${blocoAjuda()}</div>`;};}

/* Manda o horário escolhido para o n8n (mesmo endpoint, tipo diferente) */
async function enviarAgendamento(slot,quando){
  try{
    await fetch('/api/candidatura',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tipo:'agendamento',vaga:VAGA.titulo,nome:st.cand.nome,email:st.cand.email,
        telefone:st.cand.telefone,slot_id:slot.id,entrevista_iso:slot.date.toISOString().slice(0,10)+'T'+slot.time+':00',
        entrevista_em:quando,data:new Date().toISOString()})});
  }catch(e){ /* best-effort */ }
}


/* ===== ENVIO REAL (grava no Sheets via função serverless -> n8n) ===== */
async function enviarCandidatura(base){
  const tri={}; TRIAGEM.forEach(t=>{const idx=st.triagem[t.id]; tri[t.id]=(idx!=null&&t.op[idx])?t.op[idx][0]:'';});
  const body={...base, triagem_texto:tri, audios:st.videoBlobs};
  try{
    await fetch('/api/candidatura',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  }catch(e){ /* best-effort: nao bloqueia o candidato */ }
}

/* Embaralha as alternativas do teste técnico uma vez por candidato, para a posição
   da resposta certa não virar padrão entre quem faz a prova. */
(function embaralhaTecnico(){
 const sec=SECOES.find(s=>s.tipo==='mcq');if(!sec)return;
 sec.questoes.forEach(q=>{for(let i=q.op.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q.op[i],q.op[j]]=[q.op[j],q.op[i]];}});
})();

screenIntro();
</script>
